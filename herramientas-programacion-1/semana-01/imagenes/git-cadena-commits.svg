<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="215" viewBox="0 0 760 215" role="img" aria-label="Los dos commits del laboratorio en orden, con main y HEAD sobre el segundo commit" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="d2-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="d2-punta-azul" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2f7bb8"/>
    </marker>
    <filter id="d2-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f2540" flood-opacity="0.13"/>
    </filter>
  </defs>
  <line x1="298" y1="105" x2="462" y2="105" stroke="#5b6876" stroke-width="1.8" marker-end="url(#d2-punta)"/>
  <g filter="url(#d2-sombra)">
    <circle cx="265" cy="105" r="31" fill="#ffffff" stroke="#2f7bb8" stroke-width="2"/>
    <circle cx="495" cy="105" r="31" fill="#ffffff" stroke="#17456f" stroke-width="2.5"/>
  </g>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" text-anchor="middle" fill="#17456f">
    <text x="265" y="101">hash</text>
    <text x="265" y="116">inicial</text>
    <text x="495" y="101">hash</text>
    <text x="495" y="116">nuevo</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b6876">
    <text x="265" y="157">feat: crea el primer</text>
    <text x="265" y="173">programa de consola</text>
    <text x="495" y="157">feat(salida): informa que Git</text>
    <text x="495" y="173">registra el cambio</text>
  </g>
  <line x1="495" y1="27" x2="495" y2="70" stroke="#0e8f8f" stroke-width="1.8" marker-end="url(#d2-punta-azul)"/>
  <rect x="463" y="34" width="64" height="24" rx="6" fill="#0e8f8f"/>
  <text x="495" y="51" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ffffff">main</text>
  <rect x="458" y="3" width="74" height="22" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.5"/>
  <text x="495" y="19" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#0e8f8f">HEAD</text>
  <text x="380" y="207" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876">el tiempo avanza hacia la derecha</text>
</svg>
