<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Al llamar AplicarDescuento(precios, 0.10), tanto la variable precios en Main como el parametro precios de la funcion apuntan al mismo bloque de memoria del vector. Modificar una posicion desde la funcion si se ve afuera" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rc-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 13.5px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <text x="440" y="28" text-anchor="middle" class="txt" font-weight="700">AplicarDescuento(precios, 0.10);</text>

  <rect x="90" y="55" width="260" height="70" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="220" y="82" text-anchor="middle" class="sec">variable en Main</text>
  <text x="220" y="106" text-anchor="middle" class="codigo" font-weight="700">precios</text>

  <rect x="530" y="55" width="260" height="70" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="660" y="82" text-anchor="middle" class="sec">parametro de la funcion</text>
  <text x="660" y="106" text-anchor="middle" class="codigo" font-weight="700">precios</text>

  <g stroke="#0e8f8f" stroke-width="2" fill="none">
    <path d="M 220,125 L 220,160 L 440,190" marker-end="url(#rc-punta)"/>
    <path d="M 660,125 L 660,160 L 440,190" marker-end="url(#rc-punta)"/>
  </g>
  <text x="440" y="150" text-anchor="middle" class="etq">las dos apuntan al mismo bloque</text>

  <rect x="90" y="200" width="150" height="80" rx="4" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="1.75"/>
  <rect x="255" y="200" width="150" height="80" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <rect x="420" y="200" width="150" height="80" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <rect x="585" y="200" width="150" height="80" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>

  <text x="165" y="232" text-anchor="middle" class="sec">indice 0</text>
  <text x="165" y="258" text-anchor="middle" class="codigo">4599.9 &#8594; 4139.91</text>
  <text x="330" y="232" text-anchor="middle" class="sec">indice 1</text>
  <text x="330" y="258" text-anchor="middle" class="codigo">12999</text>
  <text x="495" y="232" text-anchor="middle" class="sec">indice 2</text>
  <text x="495" y="258" text-anchor="middle" class="codigo">8500.5</text>
  <text x="660" y="232" text-anchor="middle" class="sec">...</text>

  <text x="440" y="305" text-anchor="middle" class="txt">Un vector es un tipo por referencia: lo que se copia al pasarlo "por valor" es</text>
  <text x="440" y="325" text-anchor="middle" class="txt">la direccion del bloque, no el bloque completo. Por eso el cambio si se nota afuera.</text>
</svg>
