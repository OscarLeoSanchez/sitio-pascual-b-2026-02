<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Comparacion entre repetir el mismo bloque de codigo en dos lugares del programa, y escribirlo una sola vez en una funcion llamada desde dos lugares" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pcr-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="pcr-punta-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 12.5px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #2f7bb8; }
    .etq-t { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <text x="220" y="28" text-anchor="middle" class="txt" font-weight="700">Codigo repetido</text>
  <text x="660" y="28" text-anchor="middle" class="txt" font-weight="700">Una funcion, llamada dos veces</text>

  <rect x="40" y="45" width="360" height="105" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="55" y="65" class="sec">// total antes del descuento</text>
  <text x="55" y="88" class="codigo">double total0 = 0;</text>
  <text x="55" y="106" class="codigo">for (int i = 0; i &lt; precios.Length; i++)</text>
  <text x="55" y="124" class="codigo">  total0 += precios[i];</text>

  <rect x="40" y="185" width="360" height="105" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="55" y="205" class="sec">// total con descuento</text>
  <text x="55" y="228" class="codigo">double total1 = 0;</text>
  <text x="55" y="246" class="codigo">for (int i = 0; i &lt; precios.Length; i++)</text>
  <text x="55" y="264" class="codigo">  total1 += precios[i] * (1 - descuento);</text>

  <g stroke="#c4682c" stroke-width="1.75" fill="none">
    <path d="M 20,45 L 20,290" />
  </g>
  <text x="220" y="330" text-anchor="middle" class="sec">Casi identico, pegado dos veces: un error hay que corregirlo en los dos lugares.</text>

  <rect x="560" y="150" width="200" height="90" rx="9" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="1.75"/>
  <text x="660" y="185" text-anchor="middle" class="codigo" font-weight="700">CalcularTotal</text>
  <text x="660" y="205" text-anchor="middle" class="codigo">(double[] precios)</text>
  <text x="660" y="223" text-anchor="middle" class="sec">un solo bloque</text>

  <rect x="480" y="45" width="160" height="55" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="560" y="78" text-anchor="middle" class="codigo">total0 = CalcularTotal(...)</text>

  <rect x="480" y="300" width="160" height="55" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="560" y="333" text-anchor="middle" class="codigo">total1 = CalcularTotal(...)</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 590,100 L 620,150" marker-end="url(#pcr-punta)"/>
    <path d="M 590,300 L 620,240" marker-end="url(#pcr-punta)"/>
  </g>
  <text x="595" y="130" class="etq">llama</text>
  <text x="595" y="278" class="etq">llama</text>

  <g stroke="#0e8f8f" stroke-width="1.75" stroke-dasharray="6 5" fill="none">
    <path d="M 700,150 L 730,90 L 660,90" marker-end="url(#pcr-punta-t)"/>
    <path d="M 700,240 L 730,320 L 660,320" marker-end="url(#pcr-punta-t)"/>
  </g>
  <text x="745" y="75" class="etq-t">retorna</text>
  <text x="745" y="338" class="etq-t">retorna</text>

  <text x="660" y="380" text-anchor="middle" class="sec">El bloque se escribe una sola vez. Si hay un error, se corrige en un solo lugar.</text>
</svg>
