<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="Flujo del patron de un menu de consola: mostrar el menu, leer la opcion, validarla, ejecutar la funcion correspondiente con un switch, y repetir hasta que la opcion sea salir" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pm-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="pm-punta-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #2f7bb8; }
    .etq-t { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <text x="440" y="28" text-anchor="middle" class="txt" font-weight="700">El patron de un menu de consola: ciclo + seleccion + funciones</text>

  <rect x="290" y="50" width="300" height="56" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="440" y="84" text-anchor="middle" class="txt">Mostrar el menu (las 5 opciones)</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,106 L 440,138" marker-end="url(#pm-punta)"/>
  </g>

  <rect x="290" y="140" width="300" height="56" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="440" y="174" text-anchor="middle" class="txt">Leer la opcion: Console.ReadLine</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,196 L 440,228" marker-end="url(#pm-punta)"/>
  </g>

  <rect x="255" y="230" width="370" height="56" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="440" y="264" text-anchor="middle" class="txt">int.TryParse convierte el texto a numero</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,286 L 440,318" marker-end="url(#pm-punta)"/>
  </g>
  <text x="462" y="308" class="etq-t">si es valida</text>

  <rect x="240" y="320" width="400" height="70" rx="9" fill="#f6f8fa" stroke="#2f7bb8" stroke-width="1.75"/>
  <text x="440" y="349" text-anchor="middle" class="txt" font-weight="700">switch (opcion)</text>
  <text x="440" y="372" text-anchor="middle" class="sec">llama a la funcion que corresponde a esa opcion</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,390 L 440,422" marker-end="url(#pm-punta)"/>
  </g>

  <rect x="300" y="424" width="280" height="56" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="440" y="458" text-anchor="middle" class="txt">opcion == 0 ?</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,480 L 440,512" marker-end="url(#pm-punta)"/>
  </g>
  <text x="462" y="502" class="etq-t">si</text>

  <rect x="330" y="514" width="220" height="56" rx="9" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="1.75"/>
  <text x="440" y="548" text-anchor="middle" class="txt" font-weight="700">Fin del programa</text>

  <g stroke="#0e8f8f" stroke-width="2" fill="none">
    <path d="M 300,452 L 60,452 L 60,78 L 288,78" marker-end="url(#pm-punta-t)"/>
  </g>
  <text x="65" y="270" class="etq-t" transform="rotate(-90 65 270)" text-anchor="middle">no: vuelve a mostrar el menu</text>

  <g stroke="#0e8f8f" stroke-width="2" fill="none">
    <path d="M 625,258 L 820,258 L 820,78 L 592,78" marker-end="url(#pm-punta-t)"/>
  </g>
  <text x="825" y="270" class="etq-t" transform="rotate(-90 825 270)" text-anchor="middle">no valida: muestra el error y vuelve</text>

  <text x="440" y="605" text-anchor="middle" class="sec">El ciclo do-while repite este flujo completo hasta que el usuario elige la opcion 0.</text>
</svg>
