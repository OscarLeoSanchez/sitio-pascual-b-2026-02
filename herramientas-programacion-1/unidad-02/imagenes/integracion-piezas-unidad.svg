<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Integracion de las piezas de la unidad: el vector precios en el centro, con cuatro funciones a su alrededor que lo leen o lo modifican, todo orquestado por el switch del menu" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ip-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="ip-punta-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 14.5px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #2f7bb8; }
    .etq-t { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <rect x="30" y="20" width="820" height="30" rx="6" fill="none" stroke="#2f7bb8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="40" text-anchor="middle" class="etq">switch (opcion) dentro del menu decide cual funcion se ejecuta</text>

  <rect x="330" y="220" width="220" height="80" rx="9" fill="#f6f8fa" stroke="#2f7bb8" stroke-width="1.75"/>
  <text x="440" y="255" text-anchor="middle" class="txt" font-weight="700">double[] precios</text>
  <text x="440" y="278" text-anchor="middle" class="sec">el dato central del programa</text>

  <rect x="60" y="90" width="210" height="60" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="165" y="115" text-anchor="middle" class="txt" font-weight="700">MostrarVector</text>
  <text x="165" y="135" text-anchor="middle" class="sec">lee el vector, lo imprime</text>

  <rect x="610" y="90" width="210" height="60" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="715" y="115" text-anchor="middle" class="txt" font-weight="700">CalcularTotal</text>
  <text x="715" y="135" text-anchor="middle" class="sec">lee el vector, devuelve un total</text>

  <rect x="60" y="370" width="210" height="60" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="165" y="395" text-anchor="middle" class="txt" font-weight="700">AplicarDescuento</text>
  <text x="165" y="415" text-anchor="middle" class="sec">modifica cada posicion</text>

  <rect x="610" y="370" width="210" height="60" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="715" y="395" text-anchor="middle" class="txt" font-weight="700">AnalizarPrecios</text>
  <text x="715" y="415" text-anchor="middle" class="sec">lee el vector, entrega dos out</text>

  <g stroke="#5b6876" stroke-width="1.75" fill="none">
    <path d="M 270,120 L 328,240" marker-end="url(#ip-punta)"/>
  </g>
  <text x="270" y="185" class="etq">recibe</text>

  <g stroke="#5b6876" stroke-width="1.75" fill="none">
    <path d="M 610,120 L 552,240" marker-end="url(#ip-punta)"/>
  </g>
  <text x="565" y="185" class="etq">recibe</text>

  <g stroke="#0e8f8f" stroke-width="1.75" fill="none">
    <path d="M 328,280 L 270,370" marker-end="url(#ip-punta-t)"/>
  </g>
  <text x="240" y="335" class="etq-t">modifica</text>

  <g stroke="#5b6876" stroke-width="1.75" fill="none">
    <path d="M 552,280 L 610,370" marker-end="url(#ip-punta)"/>
  </g>
  <text x="580" y="335" class="etq">recibe</text>

  <text x="440" y="485" text-anchor="middle" class="sec">Vectores (tema 1), funciones (tema 3) y paso de parametros (tema 4) conviven en un solo programa: el menu (tema 5) es quien decide, en cada vuelta del ciclo, cual de estas piezas se activa.</text>
</svg>
