<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Persistencia: la memoria RAM guarda el objeto Aragorn con vida 70 pero se pierde al cerrar el programa; el disco guarda el archivo partida.txt con dos lineas y sobrevive; una flecha guardar va de la memoria al disco y una flecha leer va del disco a la memoria" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mdp-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
  </style>

  <rect x="30" y="20" width="320" height="270" rx="12" fill="#ffffff" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="190" y="52" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px">Memoria (RAM)</text>
  <rect x="55" y="75" width="270" height="100" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="190" y="101" text-anchor="middle" class="etq" fill="#0e8f8f">objeto Aragorn</text>
  <text x="75" y="130" class="codigo">Nombre = "Aragorn"</text>
  <text x="75" y="156" class="codigo">Vida   = 70</text>
  <rect x="55" y="205" width="270" height="62" rx="10" fill="#f9eceb" stroke="#b3372c" stroke-width="2.25"/>
  <text x="190" y="231" text-anchor="middle" class="etq" fill="#b3372c">se pierde al cerrar</text>
  <text x="190" y="252" text-anchor="middle" class="etq" fill="#b3372c">el programa</text>

  <rect x="530" y="20" width="320" height="270" rx="12" fill="#ffffff" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="690" y="52" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px">Disco</text>
  <rect x="555" y="75" width="270" height="100" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="690" y="101" text-anchor="middle" class="etq" fill="#0e8f8f">archivo partida.txt</text>
  <text x="572" y="130" class="codigo">Guerrero;Aragorn;70;15</text>
  <text x="572" y="156" class="codigo">Mago;Gandalf;80;40</text>
  <rect x="555" y="205" width="270" height="62" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="690" y="243" text-anchor="middle" class="etq" fill="#0e8f8f">sobrevive</text>

  <g stroke="#c4682c" stroke-width="2.5" fill="none">
    <path d="M 352,110 L 528,110" marker-end="url(#mdp-punta)"/>
    <path d="M 528,200 L 352,200" marker-end="url(#mdp-punta)"/>
  </g>
  <text x="440" y="98" text-anchor="middle" class="etq" fill="#c4682c" font-size="17px">guardar</text>
  <text x="440" y="188" text-anchor="middle" class="etq" fill="#c4682c" font-size="17px">leer</text>

  <text x="440" y="334" text-anchor="middle" class="sec">La memoria se borra al cerrar el programa. El archivo en disco conserva los datos.</text>
</svg>
