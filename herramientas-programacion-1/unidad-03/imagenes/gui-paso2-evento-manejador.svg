<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Evento y manejador: al construir la ventana, btnRegistrar.Click += AlRegistrar le deja al botón la dirección del manejador; cada clic del usuario llega por el bucle al botón, que llama a AlRegistrar, y este suma uno al campo clics y escribe el texto en lblEstado" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="punta-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/>
    </marker>
    <marker id="punta-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b3372c"/>
    </marker>
    <marker id="punta-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .cod { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .peq { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 14px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .tit { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #16202b; }
  </style>
  <text x="15" y="30" class="tit">Una sola vez, al construir la ventana</text>
  <rect x="15" y="45" width="420" height="60" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="225.0" y="80.5" class="cod" text-anchor="middle">btnRegistrar.Click += AlRegistrar;</text>
  <rect x="500" y="45" width="365" height="60" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="682.5" y="68.0" class="txt" text-anchor="middle">El botón guarda la dirección</text>
  <text x="682.5" y="93.0" class="txt" text-anchor="middle">de AlRegistrar en su lista</text>
  <path d="M 435,75 L 498,75" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <path d="M 15,135 L 865,135" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="15" y="170" class="tit">Cada vez que el usuario hace clic</text>
  <rect x="15" y="190" width="160" height="80" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="95.0" y="218" class="etq" text-anchor="middle" fill="#0e8f8f">1. Clic</text>
  <rect x="205" y="190" width="160" height="80" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="285.0" y="218" class="etq" text-anchor="middle" fill="#2f7bb8">2. Mensaje</text>
  <rect x="395" y="190" width="160" height="80" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="475.0" y="218" class="etq" text-anchor="middle" fill="#2f7bb8">3. Click</text>
  <rect x="585" y="190" width="160" height="80" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="665.0" y="218" class="etq" text-anchor="middle" fill="#c4682c">4. Manejador</text>
  <text x="95.0" y="244" class="txt" text-anchor="middle">El usuario</text>
  <text x="95.0" y="262" class="txt" text-anchor="middle">pulsa Registrar</text>
  <text x="285.0" y="244" class="txt" text-anchor="middle">El bucle lo</text>
  <text x="285.0" y="262" class="txt" text-anchor="middle">entrega al botón</text>
  <text x="475.0" y="244" class="txt" text-anchor="middle">El botón dispara</text>
  <text x="475.0" y="262" class="txt" text-anchor="middle">el evento Click</text>
  <text x="665.0" y="244" class="txt" text-anchor="middle">Llama a cada</text>
  <text x="665.0" y="262" class="txt" text-anchor="middle">manejador de su lista</text>
  <path d="M 175,230 L 203,230" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <path d="M 365,230 L 393,230" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <path d="M 555,230 L 583,230" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="755" y="190" width="110" height="80" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2.25"/>
  <text x="810.0" y="210.5" class="peq" text-anchor="middle">AlRegistrar</text>
  <text x="810.0" y="235.5" class="peq" text-anchor="middle">clics++</text>
  <text x="810.0" y="260.5" class="peq" text-anchor="middle">lblEstado</text>
  <path d="M 745,230 L 753,230" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <text x="15" y="320" class="tit">El campo clics vive mientras la ventana está abierta</text>
  <rect x="15" y="340" width="190" height="100" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="110" y="372" class="cod" text-anchor="middle" font-weight="700">clics = 0</text>
  <text x="110" y="408" class="txt" text-anchor="middle">Aún no hay clics</text>
  <path d="M 205,390 L 233,390" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <text x="219" y="380" class="sec"></text>
  <rect x="235" y="340" width="190" height="100" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="330" y="372" class="cod" text-anchor="middle" font-weight="700">clics = 1</text>
  <text x="330" y="408" class="txt" text-anchor="middle">Clic número 1</text>
  <path d="M 425,390 L 453,390" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <text x="439" y="380" class="sec"></text>
  <rect x="455" y="340" width="190" height="100" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="550" y="372" class="cod" text-anchor="middle" font-weight="700">clics = 2</text>
  <text x="550" y="408" class="txt" text-anchor="middle">Clic número 2</text>
  <path d="M 645,390 L 673,390" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <text x="659" y="380" class="sec"></text>
  <rect x="675" y="340" width="190" height="100" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="770" y="372" class="cod" text-anchor="middle" font-weight="700">clics = 3</text>
  <text x="770" y="408" class="txt" text-anchor="middle">Clic número 3</text>
  <text x="15" y="462" class="sec">Cada flecha es un clic: el manejador se ejecuta, termina, y el valor queda guardado en el objeto para el siguiente clic.</text>
</svg>
