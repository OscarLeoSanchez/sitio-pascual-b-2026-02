<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="Diagrama de clases: Guerrero y Mago heredan de la clase abstracta Personaje con flechas de generalizacion; Guerrero agrega Fuerza y Mago agrega Mana, y ambos implementan Atacar a su manera" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="uhp-hueco" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L13,7 L1,13 z" fill="#ffffff" stroke="#7a3f9d" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
  </style>

  <rect x="240" y="20" width="400" height="48" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="440" y="42" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px" font-style="italic">Personaje</text>
  <text x="440" y="60" text-anchor="middle" class="sec">abstracta</text>
  <rect x="240" y="68" width="400" height="58" fill="#e9f6f5" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="256" y="92" class="codigo">+ Nombre : string</text>
  <text x="256" y="116" class="codigo">+ Vida : int {private set}</text>
  <rect x="240" y="126" width="400" height="58" fill="#fbefe6" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="256" y="150" class="codigo" font-style="italic">+ Atacar(objetivo : Personaje) : bool</text>
  <text x="256" y="174" class="codigo" font-style="italic">+ ToLinea() : string</text>

  <g stroke="#7a3f9d" stroke-width="2.25" fill="none">
    <path d="M 220,290 L 220,240 L 340,240 L 340,185" marker-end="url(#uhp-hueco)"/>
    <path d="M 660,290 L 660,240 L 540,240 L 540,185" marker-end="url(#uhp-hueco)"/>
  </g>
  <text x="212" y="270" text-anchor="end" class="etq" fill="#7a3f9d">hereda de</text>
  <text x="668" y="270" class="etq" fill="#7a3f9d">hereda de</text>

  <rect x="30" y="290" width="380" height="36" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="220" y="315" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px">Guerrero</text>
  <rect x="30" y="326" width="380" height="36" fill="#e9f6f5" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="46" y="350" class="codigo">+ Fuerza : int</text>
  <rect x="30" y="362" width="380" height="36" fill="#fbefe6" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="46" y="386" class="codigo">+ Atacar(objetivo : Personaje) : bool</text>

  <rect x="470" y="290" width="380" height="36" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="660" y="315" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px">Mago</text>
  <rect x="470" y="326" width="380" height="36" fill="#e9f6f5" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="486" y="350" class="codigo">+ Mana : int {private set}</text>
  <rect x="470" y="362" width="380" height="36" fill="#fbefe6" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="486" y="386" class="codigo">+ Atacar(objetivo : Personaje) : bool</text>

  <rect x="120" y="414" width="640" height="34" rx="9" fill="#ffffff" stroke="#7a3f9d" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="440" y="436" text-anchor="middle" class="txt">Atacar: mismo nombre, cada clase lo implementa a su manera</text>
</svg>
