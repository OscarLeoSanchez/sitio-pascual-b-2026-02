<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="La lista y la tabla del paso 6. Registrar: AlRegistrar agrega el personaje con personajes.Add, la BindingList avisa con el evento ListChanged y la tabla dibuja una fila nueva. Elegir: un clic en una fila dispara SelectionChanged, AlSeleccionarFila toma el personaje de DataBoundItem y lo pasa a los campos. Actualizar y eliminar: se cambia la lista con personajes[i] = nuevo o personajes.Remove(actual), la BindingList avisa y la tabla se redibuja. La lista es la verdad y la tabla solo la muestra." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/></marker>
    <marker id="punta-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/></marker>
    <marker id="punta-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b3372c"/></marker>
    <marker id="punta-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/></marker>
  </defs>
  <style>
    .cod { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 15px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .tit { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #16202b; }
  </style>
  <text x="15" y="26" class="etq" fill="#c4682c" text-anchor="start">REGISTRAR: la fila nueva aparece sola</text>
  <rect x="15" y="40" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="110.0" y="69.0" class="txt" text-anchor="middle">Clic en Registrar</text>
  <text x="110.0" y="91.0" class="sec" text-anchor="middle">AlRegistrar</text>
  <path d="M 205,75 L 233,75" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="235" y="40" width="190" height="70" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="330.0" y="69.0" class="cod" text-anchor="middle">personajes.Add(nuevo)</text>
  <text x="330.0" y="91.0" class="sec" text-anchor="middle">la lista guarda el objeto</text>
  <path d="M 425,75 L 453,75" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="455" y="40" width="190" height="70" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="550.0" y="69.0" class="txt" text-anchor="middle">BindingList avisa</text>
  <text x="550.0" y="91.0" class="sec" text-anchor="middle">evento ListChanged</text>
  <path d="M 645,75 L 673,75" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="675" y="40" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="770.0" y="69.0" class="txt" text-anchor="middle">La tabla dibuja</text>
  <text x="770.0" y="91.0" class="sec" text-anchor="middle">una fila nueva</text>
  <text x="15" y="166" class="etq" fill="#c4682c" text-anchor="start">ELEGIR: los datos de la fila pasan a los campos</text>
  <rect x="15" y="180" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="110.0" y="209.0" class="txt" text-anchor="middle">Clic en una fila</text>
  <text x="110.0" y="231.0" class="sec" text-anchor="middle">SelectionChanged</text>
  <path d="M 205,215 L 233,215" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="235" y="180" width="190" height="70" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="330.0" y="209.0" class="cod" text-anchor="middle">AlSeleccionarFila</text>
  <text x="330.0" y="231.0" class="sec" text-anchor="middle">Seleccionado()</text>
  <path d="M 425,215 L 453,215" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="455" y="180" width="190" height="70" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="550.0" y="209.0" class="cod" text-anchor="middle">DataBoundItem</text>
  <text x="550.0" y="231.0" class="sec" text-anchor="middle">es el Personaje</text>
  <path d="M 645,215 L 673,215" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="675" y="180" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="770.0" y="209.0" class="txt" text-anchor="middle">Los campos</text>
  <text x="770.0" y="231.0" class="sec" text-anchor="middle">nombre, tipo, vida y extra</text>
  <text x="15" y="306" class="etq" fill="#c4682c" text-anchor="start">ACTUALIZAR Y ELIMINAR: la lista cambia y la tabla se entera</text>
  <rect x="15" y="320" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="110.0" y="349.0" class="txt" text-anchor="middle">Clic en Actualizar</text>
  <text x="110.0" y="371.0" class="sec" text-anchor="middle">o en Eliminar</text>
  <path d="M 205,355 L 233,355" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="235" y="320" width="190" height="70" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="330.0" y="349.0" class="cod" text-anchor="middle">personajes[i] = nuevo</text>
  <text x="330.0" y="371.0" class="sec" text-anchor="middle">o personajes.Remove(actual)</text>
  <path d="M 425,355 L 453,355" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="455" y="320" width="190" height="70" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="550.0" y="349.0" class="txt" text-anchor="middle">BindingList avisa</text>
  <text x="550.0" y="371.0" class="sec" text-anchor="middle">evento ListChanged</text>
  <path d="M 645,355 L 673,355" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="675" y="320" width="190" height="70" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="770.0" y="349.0" class="txt" text-anchor="middle">La tabla se redibuja</text>
  <text x="770.0" y="371.0" class="sec" text-anchor="middle">sin que hagamos nada</text>
  <rect x="15" y="424" width="850" height="36" rx="10" fill="#f1f3f5" stroke="#5b6876" stroke-width="2.25"/>
  <text x="440.0" y="447.0" class="txt" text-anchor="middle">La lista es la verdad. La tabla solo la muestra y se entera de los cambios por el aviso de la BindingList.</text>
</svg>
