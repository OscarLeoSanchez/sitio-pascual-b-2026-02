<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-labelledby="t">
<title id="t">Las tres unidades del módulo</title>
<defs>
<marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L9,3.5 L0,7 Z" fill="#5b6876"/>
</marker>
<clipPath id="tarjetas">
<rect x="12" y="20" width="254" height="110" rx="9"/>
<rect x="312" y="20" width="254" height="110" rx="9"/>
<rect x="612" y="20" width="254" height="110" rx="9"/>
</clipPath>
</defs>
<style>
text { font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif; }
.tarjeta { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
.franja { fill: #17456f; }
.titulo { fill: #0f2540; font-size: 15px; font-weight: 600; text-anchor: middle; }
.sub { fill: #5b6876; font-size: 13px; text-anchor: middle; }
.frase { fill: #16202b; font-size: 15px; text-anchor: middle; }
.flecha { stroke: #5b6876; stroke-width: 2; fill: none; }
</style>

<path class="flecha" d="M270,75 L304,75" marker-end="url(#arrowhead)"/>
<path class="flecha" d="M570,75 L604,75" marker-end="url(#arrowhead)"/>

<rect class="tarjeta" x="12" y="20" width="254" height="110" rx="9"/>
<rect class="tarjeta" x="312" y="20" width="254" height="110" rx="9"/>
<rect class="tarjeta" x="612" y="20" width="254" height="110" rx="9"/>

<g clip-path="url(#tarjetas)">
<rect class="franja" x="12" y="20" width="254" height="5"/>
<rect class="franja" x="312" y="20" width="254" height="5"/>
<rect class="franja" x="612" y="20" width="254" height="5"/>
</g>

<text class="titulo" x="139" y="60">Unidad 1</text>
<text class="sub" x="139" y="80">Semanas 1 a 5</text>
<text class="frase" x="139" y="104">Describir lo que tienes</text>

<text class="titulo" x="439" y="60">Unidad 2</text>
<text class="sub" x="439" y="80">Semanas 6 a 10</text>
<text class="frase" x="439" y="104">Modelar la incertidumbre</text>

<text class="titulo" x="739" y="60">Unidad 3</text>
<text class="sub" x="739" y="80">Semanas 11 a 16</text>
<text class="frase" x="739" y="104">Inferir sobre la población</text>
</svg>
