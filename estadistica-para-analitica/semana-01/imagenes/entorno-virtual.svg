<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t">
<title id="t">Qué aísla un entorno virtual</title>
<style>
  svg text { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
  .box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
  .box-text { font-size: 15px; fill: #16202b; text-anchor: middle; }
  .secondary { font-size: 13px; fill: #5b6876; text-anchor: middle; }
  .container { fill: #f6f8fa; stroke: #0e8f8f; stroke-width: 1.75; stroke-dasharray: 6 4; }
  .container-label { font-size: 14px; font-weight: 600; fill: #0e8f8f; }
  .arrow { stroke: #5b6876; stroke-width: 2; fill: none; }
  .command-bg { fill: #eef2f6; }
  .command-text { font-family: 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace; font-size: 13px; fill: #16202b; text-anchor: middle; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 9 3.5, 0 7" fill="#5b6876"/>
  </marker>
</defs>

<rect class="box" x="10" y="90" width="250" height="70" rx="9"/>
<text class="box-text" x="135" y="118">Python del sistema</text>
<text class="secondary" x="135" y="140">otros programas dependen de él</text>

<line class="arrow" x1="260" y1="125" x2="470" y2="125" marker-end="url(#arrowhead)"/>
<rect class="command-bg" x="279" y="114" width="172" height="22" rx="4"/>
<text class="command-text" x="365" y="129">python -m venv .venv</text>

<rect class="container" x="470" y="20" width="390" height="210" rx="10"/>
<text class="container-label" x="486" y="44">El entorno .venv</text>

<rect class="box" x="500" y="54" width="330" height="44" rx="9"/>
<text class="box-text" x="665" y="81">Copia aislada de Python</text>

<rect class="box" x="500" y="112" width="330" height="70" rx="9"/>
<text class="box-text" x="665" y="138">
  <tspan x="665" dy="0">pandas, numpy, scipy, matplotlib,</tspan>
  <tspan x="665" dy="20">seaborn, statsmodels, openpyxl</tspan>
</text>

<text class="secondary" x="665" y="206">con la versión de cada una fijada</text>
</svg>
