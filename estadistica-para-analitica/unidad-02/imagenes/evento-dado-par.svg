<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <style>
    .caja { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
    .circA { fill: #2f7bb8; fill-opacity: 0.18; stroke: #2f7bb8; stroke-width: 1.75; }
    .punto { fill: #16202b; }
    .txt { fill: #16202b; font-size: 15px; }
    .txt-sec { fill: #5b6876; font-size: 13px; }
    .titulo { fill: #16202b; font-size: 15px; font-weight: 600; }
    .etiquetaA { fill: #2f7bb8; font-size: 15px; font-weight: 600; }
  </style>

  <rect x="40" y="40" width="800" height="300" rx="9" class="caja" />
  <text x="66" y="72" class="titulo">&#937; = espacio muestral de lanzar un dado</text>

  <text x="600" y="100" class="etiquetaA" text-anchor="middle">A: sale un numero par</text>
  <ellipse cx="600" cy="190" rx="190" ry="80" class="circA" />

  <circle cx="140" cy="190" r="7" class="punto" />
  <text x="140" y="168" class="txt" text-anchor="middle">1</text>

  <circle cx="260" cy="190" r="7" class="punto" />
  <text x="260" y="168" class="txt" text-anchor="middle">3</text>

  <circle cx="380" cy="190" r="7" class="punto" />
  <text x="380" y="168" class="txt" text-anchor="middle">5</text>

  <circle cx="480" cy="190" r="7" class="punto" />
  <text x="480" y="168" class="txt" text-anchor="middle">2</text>

  <circle cx="600" cy="190" r="7" class="punto" />
  <text x="600" y="168" class="txt" text-anchor="middle">4</text>

  <circle cx="720" cy="190" r="7" class="punto" />
  <text x="720" y="168" class="txt" text-anchor="middle">6</text>

  <text x="440" y="310" class="txt-sec" text-anchor="middle">A = { 2, 4, 6 }. Complemento de A = { 1, 3, 5 }, los impares, fuera del ovalo.</text>
</svg>
