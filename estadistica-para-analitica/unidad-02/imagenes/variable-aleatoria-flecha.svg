<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#5b6876" />
    </marker>
  </defs>
  <style>
    <![CDATA[
    .caja { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
    .cajaAcento { fill: #e9f6f5; stroke: #0e8f8f; stroke-width: 1.75; }
    .txt { fill: #16202b; font-size: 15px; }
    .txt-sec { fill: #5b6876; font-size: 13px; }
    .etiqueta { fill: #5b6876; font-size: 12.5px; }
    .flecha { stroke: #5b6876; stroke-width: 2; fill: none; marker-end: url(#flecha); }
    .recta { stroke: #16202b; stroke-width: 1.5; }
    ]]>
  </style>

  <text x="150" y="45" class="txt" text-anchor="middle" font-weight="600">&#937; (espacio muestral)</text>
  <rect x="40" y="70" width="220" height="150" rx="9" class="caja" />
  <circle cx="150" cy="145" r="7" fill="#2f7bb8" />
  <text x="150" y="127" class="txt" text-anchor="middle">SC</text>
  <text x="150" y="185" class="txt-sec" text-anchor="middle">sello, cara</text>

  <line x1="270" y1="145" x2="470" y2="145" class="flecha" />
  <text x="370" y="128" class="etiqueta" text-anchor="middle">X (numero de caras)</text>

  <line x1="510" y1="250" x2="850" y2="250" class="recta" />
  <text x="850" y="275" class="txt-sec" text-anchor="end">recta real (R)</text>

  <line x1="570" y1="245" x2="570" y2="255" class="recta" />
  <text x="570" y="272" class="txt-sec" text-anchor="middle">0</text>

  <line x1="680" y1="245" x2="680" y2="255" class="recta" />
  <text x="680" y="272" class="txt-sec" text-anchor="middle">2</text>

  <circle cx="625" cy="250" r="7" fill="#0e8f8f" />
  <line x1="625" y1="235" x2="625" y2="250" stroke="#0e8f8f" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="565" y="195" width="120" height="34" rx="9" class="cajaAcento" />
  <text x="625" y="217" class="txt" text-anchor="middle">X = 1</text>

  <text x="480" y="70" class="txt-sec" text-anchor="middle">X es una funcion de &#937; en R</text>
</svg>
