<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t">
<title id="t">Qué análisis habilita cada tipo de variable: discreta y continua llevan a tablas de frecuencia, histogramas, medidas de localización y dispersión y boxplot; nominal y ordinal llevan a tablas de frecuencia y gráficos de barras, con la ordinal respetando su orden</title>
<defs>
<marker id="arrowhead3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L9,3.5 L0,7 Z" fill="#5b6876" />
</marker>
</defs>
<style>
text { font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif; }
.box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
.box-destacada { fill: #f6f8fa; stroke: #2f7bb8; stroke-width: 1.75; }
.box-acento { fill: #e9f6f5; stroke: #0e8f8f; stroke-width: 1.75; }
.titulo { fill: #16202b; font-size: 15px; font-weight: 700; text-anchor: middle; }
.box-text { fill: #16202b; font-size: 14.5px; text-anchor: middle; }
.arrow-label { fill: #5b6876; font-size: 12.5px; text-anchor: middle; }
.arrow { stroke: #5b6876; stroke-width: 2; fill: none; }
</style>

<path class="arrow" d="M220,52 L312,52" marker-end="url(#arrowhead3)" />
<path class="arrow" d="M220,128 L312,128" marker-end="url(#arrowhead3)" />
<path class="arrow" d="M220,204 L312,204" marker-end="url(#arrowhead3)" />
<path class="arrow" d="M220,280 L312,280" marker-end="url(#arrowhead3)" />

<rect class="box-destacada" x="20" y="20" width="200" height="64" rx="9" />
<text class="titulo" x="120" y="56">Discreta</text>

<rect class="box" x="320" y="20" width="540" height="64" rx="9" />
<text class="box-text" x="590" y="48"><tspan x="590" dy="0">Tabla de frecuencia, promedio, mediana</tspan><tspan x="590" dy="18">y moda</tspan></text>

<rect class="box-destacada" x="20" y="96" width="200" height="64" rx="9" />
<text class="titulo" x="120" y="132">Continua</text>

<rect class="box" x="320" y="96" width="540" height="64" rx="9" />
<text class="box-text" x="590" y="124"><tspan x="590" dy="0">Histograma, medidas de dispersión</tspan><tspan x="590" dy="18">y boxplot</tspan></text>

<rect class="box-acento" x="20" y="172" width="200" height="64" rx="9" />
<text class="titulo" x="120" y="208">Nominal</text>

<rect class="box" x="320" y="172" width="540" height="64" rx="9" />
<text class="box-text" x="590" y="200"><tspan x="590" dy="0">Tabla de frecuencia y gráfico de barras,</tspan><tspan x="590" dy="18">en cualquier orden</tspan></text>

<rect class="box-acento" x="20" y="248" width="200" height="64" rx="9" />
<text class="titulo" x="120" y="284">Ordinal</text>

<rect class="box" x="320" y="248" width="540" height="64" rx="9" />
<text class="box-text" x="590" y="276"><tspan x="590" dy="0">Tabla de frecuencia y gráfico de barras,</tspan><tspan x="590" dy="18">respetando el orden declarado</tspan></text>
</svg>
