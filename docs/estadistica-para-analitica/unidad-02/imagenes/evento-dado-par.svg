<svg viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <style>
    .caja { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
    .circA { fill: #2f7bb8; fill-opacity: 0.18; stroke: #2f7bb8; stroke-width: 1.75; }
    .punto { fill: #16202b; }
    .txt { fill: #16202b; font-size: 15px; }
    .txt-sec { fill: #5b6876; font-size: 13px; }
    .titulo { fill: #16202b; font-size: 15px; font-weight: 600; }
    .etiquetaA { fill: #2f7bb8; font-size: 15px; font-weight: 600; }
  </style>

  <rect x="40" y="40" width="800" height="260" rx="9" class="caja" />
  <text x="66" y="72" class="titulo">&#937; = espacio muestral de lanzar un dado</text>

  <ellipse cx="580" cy="170" rx="230" ry="90" class="circA" />
  <text x="580" y="90" class="etiquetaA" text-anchor="middle">A: sale un numero par</text>

  <circle cx="150" cy="170" r="7" class="punto" />
  <text x="150" y="148" class="txt" text-anchor="middle">1</text>

  <circle cx="280" cy="170" r="7" class="punto" />
  <text x="280" y="148" class="txt" text-anchor="middle">3</text>

  <circle cx="410" cy="170" r="7" class="punto" />
  <text x="410" y="148" class="txt" text-anchor="middle">5</text>

  <circle cx="530" cy="170" r="7" class="punto" />
  <text x="530" y="148" class="txt" text-anchor="middle">2</text>

  <circle cx="660" cy="170" r="7" class="punto" />
  <text x="660" y="148" class="txt" text-anchor="middle">4</text>

  <circle cx="770" cy="170" r="7" class="punto" />
  <text x="770" y="148" class="txt" text-anchor="middle">6</text>

  <text x="440" y="255" class="txt-sec" text-anchor="middle">A = { 2, 4, 6 }. Complemento de A = { 1, 3, 5 }, los impares, fuera del ovalo.</text>
</svg>
