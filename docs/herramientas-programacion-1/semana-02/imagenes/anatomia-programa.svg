<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Anatomia de un archivo Program.cs con sentencias de nivel superior: directivas using arriba, el cuerpo del programa en el centro y las definiciones de tipos opcionales al final" xmlns="http://www.w3.org/2000/svg">
