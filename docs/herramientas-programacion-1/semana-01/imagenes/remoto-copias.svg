<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="El repositorio local conserva la historia y git push publica una copia personal en GitHub" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rc-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#17456f"/>
    </marker>
    <filter id="rc-sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.13"/>
    </filter>
  </defs>
  <g filter="url(#rc-sombra)">
    <rect x="70" y="85" width="300" height="150" rx="12" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.8"/>
    <rect x="530" y="85" width="300" height="150" rx="12" fill="#ecf6f5" stroke="#0e8f8f" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="220" y="130" font-size="21" font-weight="700" fill="#0f2540">Repositorio local</text>
    <text x="220" y="162" font-size="14" fill="#5b6876">La carpeta .git conserva</text>
    <text x="220" y="184" font-size="14" fill="#5b6876">los dos commits en tu computador</text>
    <text x="680" y="130" font-size="21" font-weight="700" fill="#0e8f8f">GitHub</text>
    <text x="680" y="160" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#17456f">origin</text>
    <text x="680" y="188" font-size="14" fill="#5b6876">Tu copia personal en internet</text>
  </g>
  <line x1="382" y1="160" x2="518" y2="160" stroke="#17456f" stroke-width="2.5" marker-end="url(#rc-punta)"/>
  <rect x="402" y="126" width="96" height="27" rx="13.5" fill="#17456f"/>
  <text x="450" y="145" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#ffffff">git push</text>
  <text x="450" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#5b6876">El primer push publica la historia local. Los archivos continúan en tu computador.</text>
</svg>
