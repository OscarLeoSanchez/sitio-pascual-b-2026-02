<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Anatomia de la firma de una funcion en C#: modificador static, tipo de retorno double, nombre CalcularTotal, lista de parametros double vector precios, y cuerpo con return" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="af-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 17px; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
  </style>

  <text x="440" y="30" text-anchor="middle" class="txt" font-weight="700">static double CalcularTotal(double[] precios) { ... return total; }</text>

  <text x="40" y="80" class="codigo" fill="#c4682c">static</text>
  <text x="118" y="80" class="codigo" fill="#2f7bb8">double</text>
  <text x="204" y="80" class="codigo" fill="#0e8f8f">CalcularTotal</text>
  <text x="360" y="80" class="codigo" fill="#7a3f9d">(double[] precios)</text>

  <rect x="40" y="90" width="66" height="4" fill="#c4682c"/>
  <rect x="118" y="90" width="70" height="4" fill="#2f7bb8"/>
  <rect x="204" y="90" width="140" height="4" fill="#0e8f8f"/>
  <rect x="360" y="90" width="185" height="4" fill="#7a3f9d"/>

  <g stroke="#5b6876" stroke-width="1.75" fill="none">
    <path d="M 73,94 L 73,130" marker-end="url(#af-punta)"/>
    <path d="M 153,94 L 153,130" marker-end="url(#af-punta)"/>
    <path d="M 274,94 L 274,130" marker-end="url(#af-punta)"/>
    <path d="M 452,94 L 452,130" marker-end="url(#af-punta)"/>
  </g>

  <rect x="15" y="132" width="120" height="70" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="75" y="155" text-anchor="middle" class="etq" fill="#c4682c">Modificador</text>
  <text x="75" y="175" text-anchor="middle" class="sec">visible dentro</text>
  <text x="75" y="190" text-anchor="middle" class="sec">del programa</text>

  <rect x="105" y="132" width="140" height="70" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="175" y="155" text-anchor="middle" class="etq" fill="#2f7bb8">Tipo de retorno</text>
  <text x="175" y="175" text-anchor="middle" class="sec">que dato entrega</text>
  <text x="175" y="190" text-anchor="middle" class="sec">el return</text>

  <rect x="215" y="132" width="140" height="70" rx="9" fill="#f6f8fa" stroke="#2f7bb8" stroke-width="1.75"/>
  <text x="285" y="155" text-anchor="middle" class="etq" fill="#0e8f8f">Nombre</text>
  <text x="285" y="175" text-anchor="middle" class="sec">como se invoca</text>
  <text x="285" y="190" text-anchor="middle" class="sec">la funcion</text>

  <rect x="365" y="132" width="220" height="70" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="475" y="155" text-anchor="middle" class="etq" fill="#7a3f9d">Parametros</text>
  <text x="475" y="175" text-anchor="middle" class="sec">variables locales que</text>
  <text x="475" y="190" text-anchor="middle" class="sec">la funcion recibe al llamarla</text>

  <rect x="40" y="230" width="800" height="100" rx="9" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="1.75"/>
  <text x="60" y="255" class="codigo" fill="#16202b" font-size="15px">{</text>
  <text x="80" y="278" class="codigo" fill="#16202b" font-size="15px">double total = 0;</text>
  <text x="80" y="298" class="codigo" fill="#16202b" font-size="15px">for (...) { total += precios[i]; }</text>
  <text x="80" y="318" class="codigo" fill="#c4682c" font-size="15px">return total;</text>
  <text x="820" y="318" text-anchor="end" class="codigo" fill="#16202b" font-size="15px">}</text>

  <text x="440" y="352" text-anchor="middle" class="sec">El cuerpo hace el trabajo. return entrega el resultado y termina la funcion ahi mismo.</text>
</svg>
