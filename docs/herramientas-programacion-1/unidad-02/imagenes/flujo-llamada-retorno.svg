<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Flujo de ejecucion al llamar una funcion: el programa llega a la linea de la llamada, salta al cuerpo de la funcion, la ejecuta, y regresa al punto exacto donde se quedo con el valor de retorno" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flr-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2f7bb8"/>
    </marker>
    <marker id="flr-punta-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 13.5px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #2f7bb8; }
    .etq-t { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <text x="180" y="26" text-anchor="middle" class="txt" font-weight="700">Main</text>
  <text x="690" y="26" text-anchor="middle" class="txt" font-weight="700">CalcularTotal(precios)</text>

  <rect x="30" y="45" width="300" height="42" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="45" y="70" class="codigo">... codigo anterior ...</text>

  <rect x="30" y="125" width="300" height="42" rx="9" fill="#f6f8fa" stroke="#2f7bb8" stroke-width="1.75"/>
  <text x="45" y="150" class="codigo">double total = CalcularTotal(precios);</text>

  <rect x="30" y="255" width="300" height="42" rx="9" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="1.75"/>
  <text x="45" y="280" class="codigo">Console.WriteLine(total);</text>

  <rect x="560" y="100" width="290" height="130" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="575" y="125" class="codigo">double total = 0;</text>
  <text x="575" y="147" class="codigo">for (int i = 0; i &lt; precios.Length; i++)</text>
  <text x="575" y="169" class="codigo">  total += precios[i];</text>
  <text x="575" y="200" class="codigo" fill="#0e8f8f" font-weight="700">return total;</text>

  <g stroke="#2f7bb8" stroke-width="2" fill="none">
    <path d="M 330,146 C 450,146 450,146 560,146" marker-end="url(#flr-punta)"/>
  </g>
  <text x="445" y="130" text-anchor="middle" class="etq">1. llama y salta al cuerpo</text>

  <g stroke="#5b6876" stroke-width="1.5" stroke-dasharray="3 4" fill="none">
    <path d="M 705,230 L 705,240 L 705,250" />
  </g>
  <text x="705" y="250" text-anchor="middle" class="sec">2. ejecuta linea por linea</text>

  <g stroke="#0e8f8f" stroke-width="2" fill="none">
    <path d="M 705,230 C 705,300 450,276 330,276" marker-end="url(#flr-punta-t)" stroke-dasharray="6 5"/>
  </g>
  <text x="445" y="300" text-anchor="middle" class="etq-t">3. retorna con el valor de total</text>

  <text x="440" y="330" text-anchor="middle" class="sec">El programa vuelve exactamente al punto donde se quedo, con el resultado ya calculado.</text>
</svg>
