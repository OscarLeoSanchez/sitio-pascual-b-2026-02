<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Anatomia de un vector en memoria: casillas contiguas numeradas de 0 a Length menos 1, cada una con un valor, con el indice como desplazamiento desde el inicio del bloque" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="am-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="am-punta-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 13.5px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #2f7bb8; }
    .etq-t { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0e8f8f; }
  </style>

  <text x="440" y="28" text-anchor="middle" class="txt" font-weight="700">double[] precios = { 4599.90, 12999.00, 8500.50, 2300.00, 15750.75 };</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 130,50 L 130,88" marker-end="url(#am-punta)"/>
  </g>
  <text x="130" y="46" text-anchor="middle" class="etq">valor guardado</text>

  <rect x="45" y="90" width="150" height="90" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <rect x="205" y="90" width="150" height="90" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <rect x="365" y="90" width="150" height="90" rx="4" fill="#f6f8fa" stroke="#2f7bb8" stroke-width="1.75"/>
  <rect x="525" y="90" width="150" height="90" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  <rect x="685" y="90" width="150" height="90" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>

  <text x="120" y="142" text-anchor="middle" class="codigo">4599.9</text>
  <text x="280" y="142" text-anchor="middle" class="codigo">12999</text>
  <text x="440" y="142" text-anchor="middle" class="codigo">8500.5</text>
  <text x="600" y="142" text-anchor="middle" class="codigo">2300</text>
  <text x="760" y="142" text-anchor="middle" class="codigo">15750.8</text>

  <line x1="45" y1="90" x2="45" y2="180" stroke="#0e8f8f" stroke-width="2.5"/>
  <line x1="835" y1="90" x2="835" y2="180" stroke="#0e8f8f" stroke-width="2.5"/>
  <line x1="45" y1="90" x2="835" y2="90" stroke="#0e8f8f" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>

  <text x="120" y="210" text-anchor="middle" class="etq-t">0</text>
  <text x="280" y="210" text-anchor="middle" class="etq-t">1</text>
  <text x="440" y="210" text-anchor="middle" class="etq-t">2</text>
  <text x="600" y="210" text-anchor="middle" class="etq-t">3</text>
  <text x="760" y="210" text-anchor="middle" class="etq-t">4</text>

  <g stroke="#5b6876" stroke-width="2" fill="none">
    <path d="M 440,180 L 440,232" marker-end="url(#am-punta)"/>
  </g>
  <text x="440" y="252" text-anchor="middle" class="etq">indice: desplazamiento desde el inicio del bloque</text>

  <g stroke="#0e8f8f" stroke-width="1.5" fill="none">
    <path d="M 45,270 L 45,285 L 195,285 L 195,270" marker-start="url(#am-punta-t)"/>
  </g>
  <text x="120" y="300" text-anchor="middle" class="sec">primer indice: siempre 0</text>

  <g stroke="#0e8f8f" stroke-width="1.5" fill="none">
    <path d="M 685,270 L 685,285 L 835,285 L 835,270" marker-start="url(#am-punta-t)"/>
  </g>
  <text x="760" y="300" text-anchor="middle" class="sec">ultimo indice: Length - 1 = 4</text>

  <text x="440" y="325" text-anchor="middle" class="sec">precios.Length vale 5: el numero de casillas, no el ultimo indice valido.</text>
</svg>
