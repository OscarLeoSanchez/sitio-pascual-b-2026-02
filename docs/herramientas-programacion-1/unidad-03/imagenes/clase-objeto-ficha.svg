<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="425" viewBox="0 0 880 425" role="img" aria-label="La clase Guerrero es un molde con atributos Nombre, Vida y Fuerza y metodos RecibirDano, Curar y Atacar; de ese molde se crean con new dos objetos, aragorn con Fuerza 15 y boromir con Fuerza 12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="coc-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
  </style>

  <text x="440" y="26" text-anchor="middle" class="txt" font-weight="700">Una clase es el molde, los objetos son las piezas que salen de el</text>

  <rect x="200" y="42" width="480" height="128" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="440" y="70" text-anchor="middle" class="etq" fill="#2f7bb8" font-size="18px">Clase Guerrero (el molde)</text>
  <text x="222" y="104" class="codigo"><tspan fill="#2f7bb8" font-weight="700">TIENE:</tspan> Nombre, Vida, Fuerza</text>
  <text x="222" y="140" class="codigo"><tspan fill="#c4682c" font-weight="700">HACE:</tspan> RecibirDano(), Curar(), Atacar()</text>

  <g stroke="#c4682c" stroke-width="2.25" fill="none" stroke-dasharray="7 5">
    <path d="M 300,170 L 220,258" marker-end="url(#coc-punta)"/>
    <path d="M 580,170 L 660,258" marker-end="url(#coc-punta)"/>
  </g>
  <text x="248" y="206" text-anchor="end" class="codigo" fill="#c4682c">new Guerrero(...)</text>
  <text x="632" y="206" class="codigo" fill="#c4682c">new Guerrero(...)</text>

  <rect x="40" y="262" width="360" height="124" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="220" y="290" text-anchor="middle" class="etq" fill="#0e8f8f" font-size="18px">objeto aragorn</text>
  <text x="62" y="320" class="codigo">Nombre = "Aragorn"</text>
  <text x="62" y="346" class="codigo">Vida   = 100</text>
  <text x="62" y="372" class="codigo">Fuerza = 15</text>

  <rect x="480" y="262" width="360" height="124" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="660" y="290" text-anchor="middle" class="etq" fill="#0e8f8f" font-size="18px">objeto boromir</text>
  <text x="502" y="320" class="codigo">Nombre = "Boromir"</text>
  <text x="502" y="346" class="codigo">Vida   = 100</text>
  <text x="502" y="372" class="codigo">Fuerza = 12</text>

  <text x="440" y="414" text-anchor="middle" class="sec">Mismo molde, datos distintos: cada objeto guarda sus propios valores.</text>
</svg>
