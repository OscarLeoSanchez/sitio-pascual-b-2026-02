<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="El camino de los datos en el paso 8. El archivo partida.txt está en el disco. Al arrancar o con el botón Abrir, CargarDesde llama a Partida.Cargar y Reemplazar deja la lista en memoria. Al cerrar o con el botón Guardar, GuardarEn llama a Partida.Guardar y escribe el archivo. Cada vez que la lista cambia, el evento ListChanged llama a Mostrar, que filtra con Buscar según el texto de txtBuscar y llena la tabla en pantalla. Escribir en txtBuscar también llama a Mostrar." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/></marker>
    <marker id="punta-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/></marker>
    <marker id="punta-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b3372c"/></marker>
    <marker id="punta-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/></marker>
  </defs>
  <style>
    .cod { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 15px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .tit { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #16202b; }
  </style>
  <text x="15" y="26" class="etq" fill="#c4682c" text-anchor="start">EN DISCO</text>
  <text x="345" y="26" class="etq" fill="#0e8f8f" text-anchor="start">EN MEMORIA</text>
  <text x="675" y="26" class="etq" fill="#2f7bb8" text-anchor="start">EN PANTALLA</text>
  <rect x="15" y="40" width="190" height="90" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="110.0" y="68.0" class="cod" text-anchor="middle">partida.txt</text>
  <text x="110.0" y="90.0" class="sec" text-anchor="middle">Tipo;Nombre;Vida;Extra</text>
  <text x="110.0" y="112.0" class="sec" text-anchor="middle">una línea por personaje</text>
  <rect x="345" y="40" width="190" height="90" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="440.0" y="68.0" class="cod" text-anchor="middle">registro.Personajes</text>
  <text x="440.0" y="90.0" class="sec" text-anchor="middle">la lista completa</text>
  <text x="440.0" y="112.0" class="sec" text-anchor="middle">lo que hay en el registro</text>
  <rect x="675" y="40" width="190" height="90" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="770.0" y="68.0" class="cod" text-anchor="middle">grilla</text>
  <text x="770.0" y="90.0" class="sec" text-anchor="middle">solo las filas que</text>
  <text x="770.0" y="112.0" class="sec" text-anchor="middle">coinciden con la búsqueda</text>
  <path d="M 205,65 L 343,65" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#punta-o)"/>
  <text x="274" y="56" class="cod" text-anchor="middle">CargarDesde</text>
  <path d="M 343,108 L 207,108" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#punta-o)"/>
  <text x="274" y="128" class="cod" text-anchor="middle">GuardarEn</text>
  <path d="M 535,85 L 673,85" fill="none" stroke="#0e8f8f" stroke-width="2.25" marker-end="url(#punta-v)"/>
  <text x="604" y="76" class="cod" text-anchor="middle">Mostrar()</text>
  <rect x="15" y="190" width="190" height="76" rx="10" fill="#f1f3f5" stroke="#5b6876" stroke-width="2.25"/>
  <text x="110.0" y="211.0" class="cod" text-anchor="middle">Dispara CargarDesde</text>
  <text x="110.0" y="233.0" class="sec" text-anchor="middle">botón Abrir o arranque</text>
  <text x="110.0" y="255.0" class="sec" text-anchor="middle">usa Partida.Cargar</text>
  <rect x="15" y="290" width="190" height="86" rx="10" fill="#f1f3f5" stroke="#5b6876" stroke-width="2.25"/>
  <text x="110.0" y="316.0" class="cod" text-anchor="middle">Dispara GuardarEn</text>
  <text x="110.0" y="338.0" class="sec" text-anchor="middle">botón Guardar o cierre</text>
  <text x="110.0" y="360.0" class="sec" text-anchor="middle">usa Partida.Guardar</text>
  <rect x="345" y="190" width="190" height="76" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="440.0" y="222.0" class="cod" text-anchor="middle">ListChanged</text>
  <text x="440.0" y="244.0" class="sec" text-anchor="middle">la lista avisó que cambió</text>
  <rect x="675" y="190" width="190" height="76" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="770.0" y="222.0" class="cod" text-anchor="middle">txtBuscar</text>
  <text x="770.0" y="244.0" class="sec" text-anchor="middle">evento TextChanged</text>
  <path d="M 440,190 L 440,132" fill="none" stroke="#c4682c" stroke-width="2.25" stroke-dasharray="7 5" marker-end="url(#punta-o)"/>
  <path d="M 770,190 L 770,132" fill="none" stroke="#2f7bb8" stroke-width="2.25" stroke-dasharray="7 5" marker-end="url(#punta)"/>
  <text x="455" y="166" class="sec" text-anchor="start">llama a Mostrar</text>
  <text x="755" y="166" class="sec" text-anchor="end">llama a Mostrar</text>
  <rect x="345" y="290" width="520" height="76" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="605.0" y="311.0" class="cod" text-anchor="middle">registro.Buscar(txtBuscar.Text).ToList()</text>
  <text x="605.0" y="333.0" class="sec" text-anchor="middle">es lo que Mostrar asigna a grilla.DataSource</text>
  <text x="605.0" y="355.0" class="sec" text-anchor="middle">una copia filtrada, con los mismos objetos</text>
  <rect x="15" y="400" width="850" height="36" rx="10" fill="#f1f3f5" stroke="#5b6876" stroke-width="2.25"/>
  <text x="440.0" y="423.0" class="txt" text-anchor="middle">La ventana pide la ruta con SaveFileDialog u OpenFileDialog; GuardarEn y CargarDesde hacen el trabajo.</text>
</svg>
