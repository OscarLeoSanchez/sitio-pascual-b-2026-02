<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="El bucle de mensajes de Application.Run: Windows pone clics y teclas en una cola, el bucle toma un mensaje, lo entrega al formulario y vuelve a esperar; al cerrar la ventana el bucle termina y Main continúa" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="punta-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/>
    </marker>
    <marker id="punta-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b3372c"/>
    </marker>
    <marker id="punta-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0e8f8f"/>
    </marker>
  </defs>
  <style>
    .cod { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .peq { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 14px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .tit { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #16202b; }
  </style>
  <rect x="15" y="60" width="190" height="90" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="110.0" y="85.5" class="etq" text-anchor="middle" fill="#0e8f8f">Usuario</text>
  <text x="110.0" y="110.5" class="txt" text-anchor="middle">clic, tecla,</text>
  <text x="110.0" y="135.5" class="txt" text-anchor="middle">mover la ventana</text>
  <rect x="250" y="60" width="190" height="90" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="345.0" y="85.5" class="etq" text-anchor="middle" fill="#2f7bb8">Cola de mensajes</text>
  <text x="345.0" y="110.5" class="txt" text-anchor="middle">de Windows</text>
  <text x="345.0" y="135.5" class="txt" text-anchor="middle">uno tras otro</text>
  <path d="M 205,105 L 248,105" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <path d="M 440,105 L 483,105" fill="none" stroke="#5b6876" stroke-width="2.25" marker-end="url(#punta)"/>
  <rect x="485" y="20" width="380" height="280" rx="14" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25" stroke-dasharray="7 5"/>
  <text x="675" y="52" class="etq" text-anchor="middle" fill="#c4682c">Application.Run: el bucle de mensajes</text>
  <rect x="515" y="75" width="320" height="50" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2.25"/>
  <text x="675.0" y="105.5" class="txt" text-anchor="middle">1. Toma el siguiente mensaje</text>
  <rect x="515" y="160" width="320" height="50" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2.25"/>
  <text x="675.0" y="190.5" class="txt" text-anchor="middle">2. Lo entrega al formulario</text>
  <rect x="515" y="235" width="320" height="45" rx="10" fill="#ffffff" stroke="#5b6876" stroke-width="2.25"/>
  <text x="675.0" y="263.0" class="txt" text-anchor="middle">3. Vuelve al paso 1</text>
  <path d="M 675,125 L 675,158" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#punta-o)"/>
  <path d="M 675,210 L 675,233" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#punta-o)"/>
  <path d="M 835,257 L 850,257 L 850,100 L 837,100" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#punta-o)"/>
  <rect x="250" y="165" width="190" height="90" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="345.0" y="190.5" class="etq" text-anchor="middle" fill="#0e8f8f">El formulario</text>
  <text x="345.0" y="215.5" class="txt" text-anchor="middle">reacciona: dibuja,</text>
  <text x="345.0" y="240.5" class="txt" text-anchor="middle">llama a un manejador</text>
  <path d="M 515,200 L 442,200" fill="none" stroke="#0e8f8f" stroke-width="2.25" marker-end="url(#punta-v)"/>
  <text x="478" y="175" class="txt"></text>
  <rect x="250" y="320" width="340" height="60" rx="10" fill="#f9eceb" stroke="#b3372c" stroke-width="2.25"/>
  <text x="420.0" y="343.0" class="txt" text-anchor="middle">Se cierra la ventana: el bucle termina</text>
  <text x="420.0" y="368.0" class="txt" text-anchor="middle">y Main sigue hasta su última línea</text>
  <path d="M 675,300 L 675,350 L 592,350" fill="none" stroke="#b3372c" stroke-width="2.25" stroke-dasharray="7 5" marker-end="url(#punta-r)"/>
  <text x="15" y="255" class="sec">Mientras la ventana esté abierta,</text>
  <text x="15" y="277" class="sec">el programa no termina: espera.</text>
</svg>
