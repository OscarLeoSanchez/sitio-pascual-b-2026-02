<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="El constructor de Guerrero usa Math.Clamp para limitar la vida entre 0 y VidaMaxima: new Guerrero con vida 150 nace con Vida 100, y con vida menos 20 nace con Vida 0" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cc-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="cc-punta-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c4682c"/>
    </marker>
  </defs>
  <style>
    .codigo { font-family: Cascadia Mono, Consolas, SFMono-Regular, monospace; font-size: 16px; fill: #16202b; }
    .txt { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16202b; }
    .sec { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5b6876; }
    .etq { font-family: Segoe UI, Inter, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
  </style>

  <rect x="15" y="20" width="250" height="76" rx="10" fill="#eaf2f9" stroke="#2f7bb8" stroke-width="2.25"/>
  <text x="30" y="52" class="codigo">new Guerrero(</text>
  <text x="30" y="78" class="codigo">"Aragorn", 150, 15)</text>

  <rect x="325" y="20" width="330" height="76" rx="10" fill="#fbefe6" stroke="#c4682c" stroke-width="2.25"/>
  <text x="490" y="46" text-anchor="middle" class="etq" fill="#c4682c">El constructor aplica</text>
  <text x="490" y="76" text-anchor="middle" class="codigo">Math.Clamp(vida, 0, VidaMaxima)</text>

  <rect x="715" y="20" width="150" height="76" rx="10" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2.25"/>
  <text x="790" y="46" text-anchor="middle" class="etq" fill="#0e8f8f">El objeto nace</text>
  <text x="790" y="76" text-anchor="middle" class="codigo" font-weight="700">Vida = 100</text>

  <g stroke="#5b6876" stroke-width="2.25" fill="none">
    <path d="M 265,58 L 323,58" marker-end="url(#cc-punta)"/>
    <path d="M 655,58 L 713,58" marker-end="url(#cc-punta)"/>
  </g>

  <text x="40" y="150" class="txt" font-weight="700">Vida 150: se pasa del maximo</text>

  <rect x="140" y="200" width="400" height="28" rx="6" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="540" y="200" width="200" height="28" rx="6" fill="#f9eceb" stroke="#b3372c" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 740,196 C 740,166 548,166 543,194" fill="none" stroke="#c4682c" stroke-width="2.25" marker-end="url(#cc-punta-o)"/>
  <text x="640" y="160" text-anchor="middle" class="etq" fill="#c4682c">se recorta a 100</text>
  <text x="140" y="254" text-anchor="middle" class="codigo">0</text>
  <text x="540" y="254" text-anchor="middle" class="codigo">100</text>
  <text x="740" y="254" text-anchor="middle" class="codigo" fill="#b3372c" font-weight="700">150</text>
  <text x="340" y="220" text-anchor="middle" class="sec">rango valido</text>

  <text x="40" y="304" class="txt" font-weight="700">Vida -20: se pasa por debajo</text>

  <rect x="140" y="330" width="400" height="28" rx="6" fill="#e9f6f5" stroke="#0e8f8f" stroke-width="2"/>
  <rect x="60" y="330" width="80" height="28" rx="6" fill="#f9eceb" stroke="#b3372c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="394" text-anchor="middle" class="codigo" fill="#b3372c" font-weight="700">-20</text>
  <text x="140" y="394" text-anchor="middle" class="codigo">0</text>
  <text x="540" y="394" text-anchor="middle" class="codigo">100</text>
  <text x="340" y="304" class="codigo">new Guerrero("Aragorn", -20, 15)</text>
  <text x="590" y="350" class="codigo" font-weight="700" fill="#0e8f8f">Vida = 0</text>
</svg>
