project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll

lang: es

website:
  title: "Clases Pascual Bravo 2026-02"
  description: "Material de Herramientas de Programación I y Estadística para Analítica. Institución Universitaria Pascual Bravo."
  site-url: "https://oscarleosanchez.github.io/sitio-pascual-b-2026-02/"
  favicon: estilos/favicon.svg
  search:
    location: sidebar
    type: textbox
  # Sin navbar a proposito: cada estudiante entra por el enlace de su curso y
  # no debe ver los demas. La navegacion vive en la barra lateral de cada curso.
  sidebar:
    # Sin title: Quarto lo renderiza como enlace a la raiz del sitio, que es
    # justo la pagina donde aparecen todos los cursos.
    - id: herramientas-1
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: herramientas-programacion-1/index.qmd
        - section: "Unidad 1. Aplicaciones de consola con un IDE"
          contents:
            - text: "Semana 1. Entorno, Git y GitHub"
              href: herramientas-programacion-1/semana-01/index.qmd
    - id: estadistica
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del módulo"
          href: estadistica-para-analitica/index.qmd
        - section: "Unidad 1. Análisis descriptivo y exploratorio"
          contents:
            - text: "Semana 1. Presentación y entorno de trabajo"
              href: estadistica-para-analitica/semana-01/index.qmd
  page-footer:
    background: light
    left: "Oscar Leonel Sánchez Conde"
    center: "Institución Universitaria Pascual Bravo. Facultad de Ingeniería"
    right: "Semestre 2026-02"

format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    # Anchos nominales de la grilla. Quarto los ajusta al espacio disponible,
    # asi que el cuerpo termina entre 875px y 930px segun la pantalla. El
    # centrado del bloque completo se hace en estilo.scss.
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
