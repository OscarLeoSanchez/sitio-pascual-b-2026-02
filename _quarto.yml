project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll
    - herramientas-programacion-1/unidad-02/retos-matrices.html
    - herramientas-programacion-1/unidad-02/presentacion-funciones.html
    - herramientas-programacion-1/unidad-03/presentacion-poo.html
    - herramientas-programacion-1/unidad-03/presentacion-poo-videojuego.html
    - herramientas-programacion-1/unidad-03/presentacion-gui-parte-1.html
    - estadistica-para-analitica/unidad-02/presentacion-condicional-bayes.html
    - estadistica-para-analitica/unidad-02/presentacion-pedidos-tarde.html
    - estadistica-para-analitica/unidad-02/presentacion-modelos-probabilidad.html
    - estadistica-para-analitica/unidad-02/presentacion-validacion-modelos.html
    - estadistica-para-analitica/unidad-02/recursos/actividad/**/*.csv
    - estadistica-para-analitica/unidad-03/presentacion-inferencia-muestreo-intervalos.html
    - estadistica-para-analitica/unidad-03/presentacion-inferencia-pruebas-hipotesis.html
    - estadistica-para-analitica/unidad-03/presentacion-inferencia-dos-poblaciones-anova.html
    - estadistica-para-analitica/unidad-03/recursos/saber11_20224.zip
    - estadistica-para-analitica/unidad-03/recursos/cookie_cats.csv

lang: es

website:
  title: "Clases Pascual Bravo 2026-02"
  description: "Material de Herramientas de Programación I y Estadística para Analítica. Institución Universitaria Pascual Bravo."
  site-url: "https://oscarleosanchez.github.io/sitio-pascual-b-2026-02/"
  favicon: estilos/favicon.svg
  search:
    location: sidebar
    type: textbox
  # Sin navbar a proposito: cada estudiante entra por el enlace de su curso y
  # no debe ver los demas. La navegacion vive en la barra lateral de cada curso.
  sidebar:
    # Sin title: Quarto lo renderiza como enlace a la raiz del sitio, que es
    # justo la pagina donde aparecen todos los cursos.
    - id: herramientas-1
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: herramientas-programacion-1/index.qmd
        - section: "Unidad 1. Aplicaciones de consola con un IDE"
          contents:
            - text: "Semana 1. Entorno, Git y GitHub"
              href: herramientas-programacion-1/semana-01/index.qmd
            - text: "Semana 2. Sintaxis, variables y consola"
              href: herramientas-programacion-1/semana-02/index.qmd
            - text: "C# desde cero (guía de sintaxis)"
              href: herramientas-programacion-1/csharp-desde-cero/index.qmd
        - section: "Unidad 2. Arreglos y funciones"
          contents:
            - text: "Presentación de la unidad"
              href: herramientas-programacion-1/unidad-02/index.qmd
            - text: "1. Vectores"
              href: herramientas-programacion-1/unidad-02/vectores.qmd
            - text: "2. Matrices"
              href: herramientas-programacion-1/unidad-02/matrices.qmd
            - text: "3. Funciones"
              href: herramientas-programacion-1/unidad-02/funciones.qmd
            - text: "4. Paso de parámetros"
              href: herramientas-programacion-1/unidad-02/paso-de-parametros.qmd
            - text: "5. Menús"
              href: herramientas-programacion-1/unidad-02/menus.qmd
        - section: "Unidad 3. Programación orientada a objetos y aplicaciones gráficas"
          contents:
            - text: "Semana 11. Presentación: programación orientada a objetos desde cero"
              href: herramientas-programacion-1/unidad-03/presentacion-poo.html
            - text: "Semanas 11, 12 y 14. Guía: clases, herencia, UML y archivos de texto"
              href: herramientas-programacion-1/unidad-03/poo-clases-herencia-archivos.qmd
            - text: "Semanas 11, 12 y 14. Presentación presencial: POO con un videojuego"
              href: herramientas-programacion-1/unidad-03/presentacion-poo-videojuego.html
            - text: "Semana 15. Guía: interfaz gráfica con Windows Forms, parte 1 (pasos 1 a 5)"
              href: herramientas-programacion-1/unidad-03/gui-winforms-parte-1.qmd
            - text: "Semana 15. Presentación: interfaz gráfica con Windows Forms, parte 1"
              href: herramientas-programacion-1/unidad-03/presentacion-gui-parte-1.html
            - text: "Semanas 15 y 16. Guía: interfaz gráfica con Windows Forms, parte 2 (pasos 6 a 8)"
              href: herramientas-programacion-1/unidad-03/gui-winforms-parte-2.qmd
    - id: estadistica
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del módulo"
          href: estadistica-para-analitica/index.qmd
        - section: "Unidad 1. Análisis descriptivo y exploratorio"
          contents:
            - text: "Semana 1. Presentación y entorno de trabajo"
              href: estadistica-para-analitica/semana-01/index.qmd
            - text: "Semana 2. Tipos de variables"
              href: estadistica-para-analitica/semana-02/index.qmd
            - text: "Semana 3. Localización, dispersión y tablas de frecuencia"
              href: estadistica-para-analitica/semana-03/index.qmd
            - text: "Semana 4. Boxplot, cuantiles y variables categóricas"
              href: estadistica-para-analitica/semana-04/index.qmd
            - text: "Semana 5. Dispersión, condicionales y cierre de la Unidad 1"
              href: estadistica-para-analitica/semana-05/index.qmd
            - text: "Laboratorio: análisis exploratorio con pandas"
              href: estadistica-para-analitica/laboratorio-pandas-eda/index.qmd
        - section: "Unidad 2. Modelos de probabilidad"
          contents:
            - text: "Presentación de la unidad"
              href: estadistica-para-analitica/unidad-02/index.qmd
            - text: "1. Variables aleatorias y espacio muestral"
              href: estadistica-para-analitica/unidad-02/variables-aleatorias.qmd
            - text: "1. Presentación: variables aleatorias"
              href: estadistica-para-analitica/unidad-02/presentacion-variables-aleatorias.qmd
            - text: "1. Presentación aplicada: caso domicilios"
              href: estadistica-para-analitica/unidad-02/presentacion-aplicada-domicilios.qmd
            - text: "2 y 3. Presentación: condicional, Bayes, valor esperado y varianza"
              href: estadistica-para-analitica/unidad-02/presentacion-condicional-bayes.html
            - text: "2. Presentación: salió positivo, ejemplos y práctica"
              href: estadistica-para-analitica/unidad-02/presentacion-pedidos-tarde.html
            - text: "4 y 5. Presentación: modelos discretos y continuos"
              href: estadistica-para-analitica/unidad-02/presentacion-modelos-probabilidad.html
            - text: "Presentación: validar el ajuste de un modelo"
              href: estadistica-para-analitica/unidad-02/presentacion-validacion-modelos.html
            - text: "Actividad evaluativa: elegir el modelo y sustentar"
              href: estadistica-para-analitica/unidad-02/actividad-evaluativa.qmd
        - section: "Unidad 3. Inferencia estadística"
          contents:
            - text: "Presentación de la unidad y datos"
              href: estadistica-para-analitica/unidad-03/index.qmd
            - text: "11 y 12. Presentación: muestreo, TLC e intervalos de confianza"
              href: estadistica-para-analitica/unidad-03/presentacion-inferencia-muestreo-intervalos.html
            - text: "13. Presentación: pruebas de hipótesis"
              href: estadistica-para-analitica/unidad-03/presentacion-inferencia-pruebas-hipotesis.html
            - text: "14. Presentación: dos poblaciones y ANOVA"
              href: estadistica-para-analitica/unidad-03/presentacion-inferencia-dos-poblaciones-anova.html
            - text: "Proyecto final: estudio estadístico para una decisión"
              href: estadistica-para-analitica/unidad-03/proyecto-final.qmd
  page-footer:
    background: light
    left: "Oscar Leonel Sánchez Conde"
    center: "Institución Universitaria Pascual Bravo. Facultad de Ingeniería"
    right: "Semestre 2026-02"

format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    # Anchos nominales de la grilla. Quarto los ajusta al espacio disponible,
    # asi que el cuerpo termina entre 875px y 930px segun la pantalla. El
    # centrado del bloque completo se hace en estilo.scss.
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
